name: collect

# Hourly trigger + concurrency group: one run polls for ~5h45m, the next one waits
# in the queue and starts as soon as it ends, giving near-continuous coverage.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # this repo only

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Poll Vast.ai every minute
        env:
          VAST_API_KEY: ${{ secrets.VAST_API_KEY }}
        run: python -u monitor.py --db /tmp/run.db --interval 60 --duration 345 --export-dir data --chunk-minutes 30 --git-push
